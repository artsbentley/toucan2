CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Deep sleep after 30 minutes of inactivity on battery.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Regular keyboard idle after 30 seconds; independent of the trackpad's scan rate.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Change the style of the status screen. Available options: 0, 1, 2
CONFIG_TOUCAN_STATUS_SCREEN=2

CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Both receive queues use non-blocking puts. Leave room for bursts of trackpad
# events alongside right-hand key presses without dropping the end of a movement.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16
CONFIG_INPUT_QUEUE_MAX_MSGS=32
