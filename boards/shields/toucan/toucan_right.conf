CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Deep sleep after 30 minutes of inactivity on battery.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Regular keyboard idle after 30 seconds; independent of the trackpad's scan rate.
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
